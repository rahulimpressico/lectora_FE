# Repo root is lectora_FE/; the Vite app lives in course_generation_frontend/
[build]
  base = "course_generation_frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_API_BASE_URL = "https://lectora-course-gen-engine.onrender.com"

# React Router — client-side routes (static assets are served first when present)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
